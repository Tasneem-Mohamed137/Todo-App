<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Todo App</title>
  <style>
    :root {
      --bg-top: #eaf0ff;
      --bg-bottom: #f6f8ff;
      --card: #ffffff;
      --ink: #111827;
      --muted: #6b7280;
      --line: #eef0f4;
      --blue: #3b82f6;
      --blue-soft: #e3edff;
      --check: #a78bfa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    }
    .card {
      width: min(520px, 100%);
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(30, 58, 138, 0.1);
    }
    h1 { font-size: 1.15rem; margin: 0 0 12px; }

    #todo-form { display: flex; gap: 8px; }
    #todo-input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fafbff;
      font-size: 0.9rem;
    }
    #todo-input:focus, .edit-input:focus { outline: 2px solid var(--blue); outline-offset: 1px; }
    #add-btn {
      padding: 0 18px;
      border: 0;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 14px 0 6px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .filters { display: flex; gap: 4px; }
    .filter {
      border: 0;
      background: transparent;
      padding: 5px 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.78rem;
      color: var(--muted);
      cursor: pointer;
    }
    .filter.active { background: var(--blue-soft); color: var(--blue); }

    #todo-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    .todo-item, .empty {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 6px;
      border-bottom: 1px solid var(--line);
    }
    .empty { color: var(--muted); font-size: 0.85rem; }
    .toggle { width: 16px; height: 16px; accent-color: var(--check); cursor: pointer; }
    .todo-text { flex: 1; cursor: text; word-break: break-word; }
    .todo-item.completed .todo-text { text-decoration: line-through; color: var(--muted); }
    .edit-input {
      flex: 1;
      padding: 6px 8px;
      font: inherit;
      border: 1px solid var(--blue);
      border-radius: 6px;
    }
    .delete { border: 0; background: transparent; cursor: pointer; opacity: 0.45; font-size: 1rem; }
    .delete:hover, .delete:focus-visible { opacity: 1; }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .footer button {
      margin-left: 6px;
      padding: 2px 8px;
      font-size: 0.72rem;
      border: 1px solid #9ca3af;
      border-radius: 3px;
      background: #f3f4f6;
      color: #374151;
      cursor: pointer;
    }
    button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Todo App</h1>

    <form id="todo-form" autocomplete="off">
      <input id="todo-input" type="text" placeholder="What needs doing?" aria-label="New todo" />
      <button id="add-btn" type="submit">Add</button>
    </form>

    <div class="toolbar">
      <span>Tip: double-click a todo to edit. Press Enter to save.</span>
      <div class="filters">
        <button class="filter active" data-filter="all" type="button">All</button>
        <button class="filter" data-filter="active" type="button">Active</button>
        <button class="filter" data-filter="completed" type="button">Completed</button>
      </div>
    </div>

    <ul id="todo-list"></ul>

    <div class="footer">
      <span id="items-left">0 items left</span>
      <div>
        <button id="clear-completed" type="button">Clear completed</button>
        <button id="clear-all" type="button">Clear all</button>
      </div>
    </div>
  </main>

  <!-- tsc output; type="module" because tsconfig uses module: ES2020 -->
  <script type="module" src="app.js"></script>
</body>
</html>
